# POLÍTICA SINTÉTICA — creada por el equipo para el hackathon. NO es la política de ningún banco real.
# El modelo de lenguaje nunca decide elegibilidad: solo este archivo, evaluado por bankagent/policy.py.
version: "2026-09-29.2"

# Fecha "hoy" del sandbox: los datos terminan el 2026-06-17.
as_of: "2026-06-17"

dispute:
  # Reglas evaluadas en orden. La primera regla de tipo 'reject' o 'handoff' que se cumpla decide;
  # si ninguna se cumple, la disputa puede abrirse de forma automática PREVIA confirmación del cliente.
  rules:
    - id: D01_already_disputed
      outcome: inform
      when: "txn_already_disputed"
      explain: "Ya existe una disputa abierta para esta transacción."
    - id: D02_declined_not_charged
      outcome: reject
      when: "txn.transaction_status == 'Declined'"
      explain: "La transacción fue rechazada: no generó cargo, no hay nada que disputar."
    - id: D03_already_reversed
      outcome: reject
      when: "txn.transaction_status == 'Reversed'"
      explain: "La transacción ya fue reversada."
    - id: D04_pending
      outcome: reject
      when: "txn.transaction_status == 'Pending'"
      explain: "La transacción está pendiente; se puede disputar cuando se asiente."
    - id: D05_too_old
      outcome: reject
      when: "txn_age_days > 120"
      explain: "Supera el plazo de 120 días para disputar."
    - id: H01_customer_not_active
      outcome: handoff
      when: "customer.customer_status != 'Active'"
      explain: "Cliente no activo: requiere revisión humana."
    - id: H02_high_amount
      outcome: handoff
      when: "txn.amount >= high_amount[txn.currency]"
      explain: "Monto alto: un analista debe revisar la disputa."
    - id: H03_fraud_signal
      outcome: handoff
      # Calibrado con split temporal (dev < 2026, test 2026): recall 72.4%, precisión 79.0%, 0.08% derivado.
      # Ver reports/fraud_threshold.md y docs/adr/0006-umbral-fraude.md.
      when: "txn.fraud_score is not None and txn.fraud_score >= 30"
      explain: "Señal de fraude alta: se transfiere a un analista de fraude."
    - id: H04_repeat_complainer
      outcome: handoff
      when: "history.is_repeat_complainer"
      explain: "Cliente con reclamos recientes: requiere revisión humana."

  high_amount:  # por moneda, en unidades locales
    USD: 1000
    MXN: 20000
    COP: 4000000
    ARS: 1000000

# Acciones permitidas y si requieren confirmación explícita del cliente.
# Cada acción tiene su propio consentimiento: "sí, pero no bloquees" abre la disputa y NO bloquea (#38).
actions:
  open_dispute: {requires_confirmation: true}
  block_card:
    requires_confirmation: true
    # Cuándo se OFRECE el bloqueo preventivo junto con la disputa. `card` es la tarjeta del producto de la
    # transacción (None si el cargo es de una cuenta o préstamo); su estado ya refleja los bloqueos de ops.
    offer_when: "card is not None and card.product_status == 'Active'"

# Límites de la conversación: cuántas veces re-preguntar antes de pasar a un humano.
conversation:
  max_consent_reasks: 1       # confirmación ambigua ("no sé, creo que sí"): 1 re-pregunta, luego handoff
