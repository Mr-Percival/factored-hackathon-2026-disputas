name: keepalive

# El plan gratis de Render duerme el servicio tras 15 min sin tráfico (~1 min en despertar). Durante la evaluación
# (hasta la final, 16/10/2026) se hace un ping cada ~10 min para que el jurado no espere. Cabe en las 750 h/mes
# gratis de una sola instancia. URL de la demo en la variable del repo DEMO_URL.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /healthz
        env:
          URL: ${{ vars.DEMO_URL }}
        run: |
          if [ "$(date -u +%Y%m%d)" -gt 20261016 ]; then echo "fuera de la ventana de evaluación"; exit 0; fi
          if [ -z "$URL" ]; then echo "DEMO_URL no configurada"; exit 0; fi
          curl -fsS --max-time 90 --retry 2 "$URL/healthz" && echo " ok"
