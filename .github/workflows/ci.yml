name: ci

on:
  push:
    branches: [main]
  pull_request:

# Mínimo privilegio para el GITHUB_TOKEN. gitleaks necesita listar los commits del PR
# (sin pull-requests: read la acción falla con 403 "Resource not accessible by integration").
permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci.lock
      # Dependencias exactas y con hash (#17); el paquete propio va aparte, sin resolver dependencias.
      - run: pip install --require-hashes -r requirements/ci.lock && pip install --no-deps -e .
      - run: pytest -q
      - run: python scripts/check_docs.py   # enlaces y referencias a tests/archivos de la documentación (#45)

  # Guardia de regresión (#36) sobre el fixture etiquetado: escenarios de la demo, 0 inseguros, handoffs completos
  # y piso de exactitud, con el router de reglas y el aprendido lite. Sin datos del organizador ni API keys.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci.lock
      # Dependencias exactas y con hash (#17); el paquete propio va aparte, sin resolver dependencias.
      - run: pip install --require-hashes -r requirements/ci.lock && pip install --no-deps -e .
      - run: python scripts/ci_guard.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  # Accesibilidad (axe-core, WCAG 2.2 A/AA) y seguridad del navegador (#35): Playwright contra la SPA compilada que
  # sirve FastAPI sobre la base del fixture. Sin datos del organizador ni API keys. Reporte: reports/a11y_security_audit.md
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci.lock
      - run: pip install --require-hashes -r requirements/ci.lock && pip install --no-deps -e .
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - id: pw
        working-directory: web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      # Navegadores de Playwright en caché por versión; las dependencias del sistema se instalan siempre (apt).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: web
        run: npx playwright install-deps chromium
      - run: npm run build
        working-directory: web
      - run: npm run e2e
        working-directory: web
        env:
          E2E_PYTHON: python
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  # Construye la imagen de la demo y comprueba que arranca y responde (no se publica).
  image:
    runs-on: ubuntu-latest
    needs: [test, web, guard, e2e]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t bankagent-web:ci .
      - name: smoke test del contenedor
        run: |
          docker run -d --name demo -p 8000:8000 bankagent-web:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/readyz && break
            sleep 2
          done
          curl -fsS http://localhost:8000/healthz
          curl -fsS http://localhost:8000/api/scenarios > /dev/null
          curl -fsS -o /dev/null -D headers.txt http://localhost:8000/
          grep -qi "content-security-policy: default-src 'self'" headers.txt
          if grep -qi "^server:" headers.txt; then echo "cabecera Server expuesta"; exit 1; fi  # --no-server-header
          docker inspect --format '{{.Config.User}}' demo | grep -qx app
      - if: always()
        run: docker logs demo || true

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
