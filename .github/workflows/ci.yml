name: ci

on:
  push:
    branches: [main]
  pull_request:

# Mínimo privilegio para el GITHUB_TOKEN. gitleaks necesita listar los commits del PR
# (sin pull-requests: read la acción falla con 403 "Resource not accessible by integration").
permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci.lock
      # Dependencias exactas y con hash (#17); el paquete propio va aparte, sin resolver dependencias.
      - run: pip install --require-hashes -r requirements/ci.lock && pip install --no-deps -e .
      - run: pytest -q

  # Guardia de regresión (#36) sobre el fixture etiquetado: escenarios de la demo, 0 inseguros, handoffs completos
  # y piso de exactitud, con el router de reglas y el aprendido lite. Sin datos del organizador ni API keys.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci.lock
      # Dependencias exactas y con hash (#17); el paquete propio va aparte, sin resolver dependencias.
      - run: pip install --require-hashes -r requirements/ci.lock && pip install --no-deps -e .
      - run: python scripts/ci_guard.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  # Construye la imagen de la demo y comprueba que arranca y responde (no se publica).
  image:
    runs-on: ubuntu-latest
    needs: [test, web, guard]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build -t bankagent-web:ci .
      - name: smoke test del contenedor
        run: |
          docker run -d --name demo -p 8000:8000 bankagent-web:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/readyz && break
            sleep 2
          done
          curl -fsS http://localhost:8000/healthz
          curl -fsS http://localhost:8000/api/scenarios > /dev/null
          curl -fsS -o /dev/null -D headers.txt http://localhost:8000/
          grep -qi "content-security-policy: default-src 'self'" headers.txt
          docker inspect --format '{{.Config.User}}' demo | grep -qx app
      - if: always()
        run: docker logs demo || true

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
