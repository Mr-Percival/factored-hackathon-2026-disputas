[project]
name = "bankagent"
version = "0.1.0"
description = "Agente de disputas de cargos no reconocidos — Factored AI & Data Hackathon 2026"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "langgraph>=1.0",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "boto3>=1.34", "pandas>=2"]
pitch = ["python-pptx>=1.0", "matplotlib>=3.8", "pyyaml>=6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
