[project]
name = "bankagent"
version = "0.1.0"
description = "Agente de disputas de cargos no reconocidos — Factored AI & Data Hackathon 2026"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "langgraph>=1.0",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "boto3>=1.34", "pandas>=2"]
llm = ["anthropic>=1.0"]  # router/writer con LLM (opcional; sin esto el agente usa reglas y plantillas)
pitch = ["python-pptx>=1.0", "matplotlib>=3.8", "pyyaml>=6", "markdown>=3.5"]
# Evaluación de inyección (#8, #9) y detector con modelo (opt-in). Sin torch: ONNX Runtime en CPU.
security-eval = ["onnxruntime>=1.17", "tokenizers>=0.15", "huggingface_hub>=0.23", "numpy>=1.26", "pandas>=2", "pyarrow>=14"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
